name = "airfryertoolkit"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "RATE_KV"
id = "7ce9f80b413e4505a03ce9230e2e741a"

# Requires Email Routing enabled for airfryertoolkit.com in the Cloudflare
# dashboard, with contact@airfryertoolkit.com verified as a destination/sender.
[[send_email]]
name = "EMAIL"
destination_address = "pereiravijeth@gmail.com"
